<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CardBridge 봇카드 변환기</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --text: #1e1e1e; --muted: #6a6a6a; --border: #dcdad4;
  --accent: #2f6db0; --accent-text: #ffffff; --ok: #2e7d4f; --approx: #9a6a00; --manual: #b3402e; --info: #4b5f7a;
  --chip: #f0efeb;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #19191b; --panel: #232326; --text: #e9e9e9; --muted: #a3a3a3; --border: #3a3a3f;
    --accent: #7eaee0; --accent-text: #101010; --ok: #6cc391; --approx: #e3b453; --manual: #f08a76; --info: #9db3d1;
    --chip: #2c2c30;
  }
}
:root[data-theme="dark"] {
  --bg: #19191b; --panel: #232326; --text: #e9e9e9; --muted: #a3a3a3; --border: #3a3a3f;
  --accent: #7eaee0; --accent-text: #101010; --ok: #6cc391; --approx: #e3b453; --manual: #f08a76; --info: #9db3d1;
  --chip: #2c2c30;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
main { max-width: 880px; margin: 0 auto; padding: 24px 16px 72px; }
h1 { font-size: 22px; margin: 0 0 2px; }
h2 { font-size: 17px; margin: 0 0 10px; }
.lead { color: var(--muted); margin: 0 0 18px; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
.drop { border: 2px dashed var(--border); border-radius: 10px; padding: 24px 12px; text-align: center; cursor: pointer; }
.drop.over { border-color: var(--accent); }
.drop small { display: block; color: var(--muted); margin-top: 4px; }
button { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 8px; padding: 9px 16px; font: inherit; cursor: pointer; }
button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
button:disabled { opacity: .5; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
.chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 13px; }
.targets { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.target { border: 1px solid var(--border); border-radius: 10px; padding: 12px; cursor: pointer; }
.target input { margin-right: 6px; }
.target p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }
.target.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.opts { display: grid; grid-template-columns: minmax(120px, 1fr) minmax(140px, 1.4fr); gap: 6px 10px; align-items: center; margin-top: 8px; }
.opts label { font-size: 14px; overflow-wrap: anywhere; }
select, input[type=text] { width: 100%; font: inherit; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); color: var(--text); }
.report-item { display: grid; grid-template-columns: 74px 92px 1fr; gap: 8px; padding: 6px 0; border-top: 1px solid var(--border); font-size: 14px; }
.report-item:first-child { border-top: 0; }
.lv { font-weight: 600; }
.lv.ok { color: var(--ok); } .lv.approx { color: var(--approx); } .lv.manual { color: var(--manual); } .lv.info { color: var(--info); }
.muted { color: var(--muted); }
.err { color: var(--manual); }
.progress { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.progress > div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
details summary { cursor: pointer; }
ol.steps { padding-left: 20px; margin: 6px 0; }
@media (max-width: 560px) { .report-item { grid-template-columns: 64px 1fr; } .report-item .area { display: none; } }
</style>
</head>
<body>
<main>
  <h1>CardBridge 봇카드 변환기</h1>
  <p class="lead">RisuAI 카드를 SillyTavern·Marinara Engine용으로 옮깁니다. 모든 처리는 이 브라우저 안에서만 이뤄집니다. <span class="muted">v{{VERSION}}</span></p>
  <div id="app"></div>
</main>
<script>/*APP*/</script>
</body>
</html>
